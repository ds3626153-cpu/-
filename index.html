/* =========================
   PAGE SWITCH
========================= */

function showPage(pageId){

  const pages =
    document.querySelectorAll(".page");

  pages.forEach(
    function(page){

      page.classList.remove(
        "active"
      );

    }
  );

  const target =
    document.getElementById(
      pageId
    );

  if(target){

    target.classList.add(
      "active"
    );

    window.scrollTo(
      0,
      0
    );

  }

}

/* =========================
   BUBBLE POP SOUND
========================= */

function bubblePopSound(){

  try{

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    const ctx =
      new AudioContext();

    const now =
      ctx.currentTime;

    const master =
      ctx.createGain();

    master.gain.setValueAtTime(
      1.4,
      now
    );

    master.gain.exponentialRampToValueAtTime(
      0.0001,
      now + 0.55
    );

    master.connect(
      ctx.destination
    );


    /* FIRST POP */

    const pop =
      ctx.createOscillator();

    const popGain =
      ctx.createGain();

    pop.type =
      "sine";

    pop.frequency.setValueAtTime(
      500,
      now
    );

    pop.frequency.exponentialRampToValueAtTime(
      55,
      now + 0.32
    );

    popGain.gain.setValueAtTime(
      0.0001,
      now
    );

    popGain.gain.exponentialRampToValueAtTime(
      1.0,
      now + 0.015
    );

    popGain.gain.exponentialRampToValueAtTime(
      0.0001,
      now + 0.35
    );

    pop.connect(
      popGain
    );

    popGain.connect(
      master
    );

    pop.start(
      now
    );

    pop.stop(
      now + 0.36
    );


    /* CRACK SOUND */

    const crack =
      ctx.createOscillator();

    const crackGain =
      ctx.createGain();

    crack.type =
      "triangle";

    crack.frequency.setValueAtTime(
      1250,
      now
    );

    crack.frequency.exponentialRampToValueAtTime(
      180,
      now + 0.18
    );

    crackGain.gain.setValueAtTime(
      0.0001,
      now
    );

    crackGain.gain.exponentialRampToValueAtTime(
      0.75,
      now + 0.008
    );

    crackGain.gain.exponentialRampToValueAtTime(
      0.0001,
      now + 0.2
    );

    crack.connect(
      crackGain
    );

    crackGain.connect(
      master
    );

    crack.start(
      now
    );

    crack.stop(
      now + 0.21
    );


    /* SECOND POP */

    const pop2 =
      ctx.createOscillator();

    const pop2Gain =
      ctx.createGain();

    pop2.type =
      "sine";

    pop2.frequency.setValueAtTime(
      700,
      now + 0.06
    );

    pop2.frequency.exponentialRampToValueAtTime(
      80,
      now + 0.30
    );

    pop2Gain.gain.setValueAtTime(
      0.0001,
      now
    );

    pop2Gain.gain.exponentialRampToValueAtTime(
      0.65,
      now + 0.07
    );

    pop2Gain.gain.exponentialRampToValueAtTime(
      0.0001,
      now + 0.35
    );

    pop2.connect(
      pop2Gain
    );

    pop2Gain.connect(
      master
    );

    pop2.start(
      now + 0.05
    );

    pop2.stop(
      now + 0.36
    );


    /* ECHO */

    const echo =
      ctx.createOscillator();

    const echoGain =
      ctx.createGain();

    echo.type =
      "sine";

    echo.frequency.setValueAtTime(
      300,
      now + 0.16
    );

    echo.frequency.exponentialRampToValueAtTime(
      70,
      now + 0.5
    );

    echoGain.gain.setValueAtTime(
      0.0001,
      now
    );

    echoGain.gain.exponentialRampToValueAtTime(
      0.35,
      now + 0.18
    );

    echoGain.gain.exponentialRampToValueAtTime(
      0.0001,
      now + 0.55
    );

    echo.connect(
      echoGain
    );

    echoGain.connect(
      master
    );

    echo.start(
      now + 0.15
    );

    echo.stop(
      now + 0.56
    );

  }

  catch(error){

    console.log(
      "Bubble sound unavailable:",
      error
    );

  }

}


/* =========================
   OPEN WEBSITE
========================= */

function openWebsite(){

  const bubble =
    document.getElementById(
      "openBubble"
    );

  if(
    bubble.classList.contains(
      "burst"
    )
  ){

    return;

  }

  bubblePopSound();

  bubble.classList.add(
    "burst"
  );

  setTimeout(
    function(){

      showPage(
        "loginPage"
      );

      bubble.classList.remove(
        "burst"
      );

    },
    650
  );

}

function checkPassword(){

  const input =
    document.getElementById(
      "passwordInput"
    );

  const error =
    document.getElementById(
      "loginError"
    );

  if(
    input.value === "BFF"
  ){

    error.textContent =
      "";

    showPage(
      "penguinPage"
    );

    input.value =
      "";

  }

  else{

    error.textContent =
      "Wrong password 🥺 Try again.";

    input.focus();

  }

    }

========================= */

function speakHelloAndShowContinue(){

  const continueButton =
    document.getElementById(
      "penguinContinue"
    );

  continueButton.classList.remove(
    "show"
  );

  if(
    !(
      "speechSynthesis"
      in window
    )
  ){

    continueButton.classList.add(
      "show"
    );

    return;

  }

  speechSynthesis.cancel();

  speechSynthesis.resume();

  const voice =
    new SpeechSynthesisUtterance(
      "Hello Deepika!"
    );

  voice.lang =
    "en-US";

  voice.rate =
    0.78;

  voice.pitch =
    1.05;

  voice.volume =
    1.0;


  const voices =
    speechSynthesis.getVoices();

  const englishVoice =
    voices.find(
      function(v){

        return v.lang &&
          v.lang
            .toLowerCase()
            .startsWith("en");

      }
    );


  if(
    englishVoice
  ){

    voice.voice =
      englishVoice;

  }


  speechSynthesis.speak(
    voice
  );


  voice.onstart =
    function(){

      setTimeout(
        function(){

          continueButton.classList.add(
            "show"
          );

        },
        400
      );

    };


  setTimeout(
    function(){

      continueButton.classList.add(
        "show"
      );

    },
    1500
  );

}

function openMessagePage(){

    );

  const hint =
    document.getElementById(
      "scrollHint"
    );

  const error =
    document.getElementById(
      "scrollError"
    );

  const box =
    document.getElementById(
      "messageScroll"
    );


  button.classList.remove(
    "show"
  );

  button.style.display =

/* =========================
   MESSAGE SCROLL CHECK
========================= */

function checkMessageScroll(){

  const box =
    document.getElementById(
      "messageScroll"
    );

  const button =
    document.getElementById(
      "continueMessage"
    );

  const hint =
    document.getElementById(
      "scrollHint"
    );

  const error =
    document.getElementById(
      "scrollError"
    );


  const currentScroll =
    box.scrollTop;

  const maxScroll =
    box.scrollHeight -
    box.clientHeight;


  const userHasScrolled =
    currentScroll > 10;


  const reachedBottom =
    currentScroll >=
    maxScroll - 10;


  if(
    userHasScrolled &&
    reachedBottom
  ){

    hint.style.display =
      "none";

    error.classList.remove(
      "show"
    );

    button.style.display =
      "inline-block";

    button.classList.add(
      "show"
    );

  }

  else{

    hint.style.display =
      "inline-block";

    button.classList.remove(
      "show"
    );

    button.style.display =
      "none";

  }

}

/* =========================
   VIDEO PLAY
========================= */

video.addEventListener(
  "play",
  function(){

    music.pause();

  }
);


/* =========================
   VIDEO ENDED
========================= */

video.addEventListener(
  "ended",
  function(){

    music.volume =
      1.0;


    const promise =
      music.play();


    if(
      promise !== undefined
    ){

      promise.catch(
        function(error){

          console.log(
            "Haareya resume error:",
            error
          );

        }
      );

    }


    setTimeout(
      function(){

        showPage(
          "finalPage"
        );

      },
      350
    );

  }
);


/* =========================
   VIDEO PAUSE
========================= */

video.addEventListener(
  "pause",
  function(){

    if(
      !video.ended
    ){

      music.pause();

    }

  }
);
